<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Element Fine Art</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Roboto&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">Element Fine Art</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="loja.html">Loja</a>
      <a href="manifesto.html">Sobre</a>
      <a href="blog.html">Blog</a>
      <a href="contato.html">Contato</a>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-text">
      Textura, tempo e natureza como matéria
    </div>
    <div class="hero-img">
      <img src="https://images.unsplash.com/photo-olive-tree" alt="Olive tree">
    </div>
  </section>

  <section class="destaques">
    <h2>Destaques</h2>
    <div class="quadros">
      <div class="quadro">
        <img src="https://images.unsplash.com/photo-mountain-path" alt="Mountain Path">
        <p>Mountain Path</p>
        <span>Juarez Saw</span>
      </div>
      <div class="quadro">
        <img src="https://images.unsplash.com/photo-urban" alt="Urban Sthouerie">
        <p>Urban Sthouerie</p>
        <span>Timato Sam</span>
      </div>
      <div class="quadro">
        <img src="https://images.unsplash.com/photo-flower" alt="Florai Study">
        <p>Florai Study</p>
        <span>Jimon Sam</span>
      </div>
    </div>
  </section>

  <div class="manifesto-link">
    Link para manifesto/marca
  </div>

  <section class="newsletter">
    <h2>Chamada para newsletter</h2>
    <button>Assinar</button>
  </section>

</html>
